# registre's declarative bootstrap. Copy it, point REGISTRE_SEED_FILE at the
# copy, and every boot brings the register up to what this file says.
#
# It carries no credentials and must not. Each account names the environment
# variable holding its secret; registre reads that variable, hashes the value
# with argon2id and stores only the hash. A secret written here would be a
# credential committed to git.
#
# Applying is an upsert keyed on client_id, and it never deletes: an account
# removed from this file is reported at boot and left working, because a client
# vanishing because somebody edited YAML is not a surprise anyone wants.

service_accounts:
  # An agent working on the user's behalf, with an identity of its own so that
  # every audit trail can tell the two apart and revoking one leaves the other
  # signed in.
  - client_id: agent-claude
    name: Claude agent
    secret_env: REGISTRE_SEED_AGENT_CLAUDE_SECRET
    scopes:
      - courrier.read
      - opus.write
    # The apps this credential works at. A token names them in its aud claim,
    # and an app that is not in this list refuses it.
    audiences:
      - courrier
      - opus
    access_token_ttl: 1h

# The clients that log humans in. A web app needs its redirect URIs — they are
# byte-compared at /authorize, never matched loosely — and names the
# environment variable holding its client secret, like a service account.
#
# scopes defaults to openid profile email. Add offline_access for refresh
# tokens and roles to receive the roles claim; visible_roles then filters
# which roles this app actually sees, and empty means none.
#
# grant_types defaults to [authorization_code, refresh_token]. The third
# alias is device_code, for a CLI that cannot open a browser on the machine it
# runs on. Redirect URIs are required of authorization_code and of nothing
# else, because the device grant has no redirect to validate.
applications:
  - client_id: courrier
    name: Courrier
    secret_env: REGISTRE_SEED_COURRIER_SECRET
    redirect_uris:
      - https://courrier.facile.studio/auth/oidc/callback
      - http://127.0.0.1:4020/auth/oidc/callback
    scopes:
      - openid
      - profile
      - email
      - offline_access
      - roles
    backchannel_logout_uri: https://courrier.facile.studio/auth/backchannel-logout
    visible_roles:
      - admin

  # A public client: no secret, because there is nowhere to keep one. Every
  # copy of a CLI binary carries whatever is compiled into it, so a secret
  # there is a secret its users all hold. Declaring public rather than leaving
  # secret_env unset is the point — an unset variable is how a confidential
  # client fails to seed, and the two states must never look alike.
  #
  # Naming a secret_env here is refused at boot, so nobody can read this entry
  # and think a secret is being checked.
  - client_id: facile-cli
    name: Facile CLI
    public: true
    grant_types:
      - device_code
      - refresh_token
    scopes:
      - openid
      - profile
      - email
      - offline_access
