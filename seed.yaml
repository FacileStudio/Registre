  - client_id: RLy72hckdFTa9eIFwCmV5MtDOWny1fLeTLpM5LUD
    name: Vision
    directory_sync_uri: https://vision.facile.studio/api/registre/sync
    deletion_uri: https://vision.facile.studio/api/registre/deletions
    backchannel_logout_uri: https://vision.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_VISION_SECRET
