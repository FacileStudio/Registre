    name: Coffre
    secret_env: REGISTRE_SEED_COFFRE_SECRET
    redirect_uris:
      - https://coffre.facile.studio/identity/connect/oidc-callback
      - https://coffre.facile.studio/auth/oidc/callback
      - https://coffre.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  - client_id: 1IdqK3bA2LWI-zuWVLqFpnIlCTVu117F
    name: Glouton
    directory_sync_uri: https://glouton.facile.studio/api/registre/sync
    deletion_uri: https://glouton.facile.studio/api/registre/deletions
