    name: Nuage
    directory_sync_uri: https://nuage.facile.studio/api/registre/sync
    backchannel_logout_uri: https://nuage.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_NUAGE_SECRET
    redirect_uris:
