  # facile-cli, the suite's own command line, and the first client that logs a
  # human in without a browser on the same machine.
  #
  # It is public: no secret_env, and none possible. The binary is installed on
  # laptops and on servers, so anything compiled into it is readable by whoever
  # has a copy, and a secret every holder can read is not one. What defends it
  # instead is the device grant itself — every login is a code a named human
  # reads and approves at sso.facile.studio/device — plus PKCE if it ever gains
  # a browser flow.
  #
  # No redirect_uris, deliberately. The device grant has no redirect; that is
  # the whole reason it exists here. `facile login` on a server used to open a
  # loopback listener and send the browser to 127.0.0.1, which on a different
  # computer is that computer, so the login silently never completed.
  #
  # offline_access is listed because a CLI that has to be re-approved by hand
  # every hour is a CLI nobody uses.
  - client_id: facile-cli
    name: Facile CLI
    public: true
    grant_types: [device_code, refresh_token]
    scopes: [openid, profile, email, offline_access]

  # Journal, the suite's centralized logging, and Nuage, its file storage. Both
  # were already pointed at registre and both already hold a secret that matches
  # what the seed names — they were simply never declared here, so /authorize
  # answered `unable to retrieve client by id` for each of them.
  #
  # Nuage is the urgent half of that pair: it runs SSO_ONLY=true, so an
  # unregistered client is not a degraded login, it is no login at all. Journal
  # runs SSO_ONLY=false and kept its password path throughout.
  #
  # journal's client id is a UUID rather than the 40-character shape Authentik
  # issued the others. It is kept as it is: the id has to match what the app
  # already sends, and what it sends is this.
  - client_id: 8bf0bcb5-e1c4-4e1e-830d-a39eb4b7c9a3
    name: Journal
    deletion_uri: https://journal.facile.studio/api/registre/deletions
    backchannel_logout_uri: https://journal.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_JOURNAL_SECRET
    redirect_uris:
      - https://journal.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

