        scopes: [courrier.read, courrier.write]
      - audience: bulle
        scopes: [bulle.read, bulle.write]

  # Sonde, the suite's self-hosted uptime monitor at sonde.facile.studio.
  #
  # This one is a fresh registration, not an Authentik carry-over: Sonde never
  # federated to the old IdP, so there is no legacy 40-character client id to
  # preserve and the id is simply its own name.
  #
  # The redirect is exact-match, byte for byte, and Sonde mounts porte's kit
  # inside router.Route("/api", ...), so the /api prefix is part of the path
  # rather than decoration. No loopback redirect: no application in this file
  # declares one, and Sonde has no browser flow that starts on localhost.
  #
  # The back-channel URI is served: porte's Kit.Mount registers
  # POST /auth/backchannel-logout for every kit with a provider configured, so
  # the route appears the moment OIDC_ISSUER is set. It answers 404 until then,
  # which is what Sonde does today, before its cutover.
  #
  # Scopes match the other recently cut-over apps. offline_access is listed
  # explicitly because porte always requests it, and without the grant refresh
  # degrades in silence. roles and visible_roles are left out: Sonde reads no
  # roles and sets no OIDC_CLAIMS_SCOPE, so granting the scope would carry a
  # claim nobody looks at.
  - client_id: sonde
    name: Sonde
    backchannel_logout_uri: https://sonde.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_SONDE_SECRET
    redirect_uris:
      - https://sonde.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  # Prisme, the suite's team chat at prisme.facile.studio: Slack-shaped, on a
  # Matrix homeserver the app runs beside itself. A fresh registration, so the
  # id is its own name, like Sonde.
  #
  # porte is mounted inside router.Route("/api", ...), so the redirect keeps
  # the /api prefix. The back-channel route is served by porte's Kit.Mount as
  # soon as OIDC_ISSUER is set. Bulle reaches Prisme with a service key and
  # names the user it acts for, so no token_exchange entry points here.
  - client_id: prisme
    name: Prisme
    directory_sync_uri: https://prisme.facile.studio/api/registre/sync
    deletion_uri: https://prisme.facile.studio/api/registre/deletions
    backchannel_logout_uri: https://prisme.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_PRISME_SECRET
    redirect_uris:
      - https://prisme.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  # Capsule, the suite's end-to-end encrypted paste at capsule.facile.studio.
  # Pastes stay anonymous; sign-in exists so the capsule CLI can hold a session
  # through the same one-step browser login as the other tools. A fresh
  # registration, so the id is its own name, like Sonde and Prisme.
  #
  # porte is mounted inside router.Route("/api", ...), so the redirect keeps
  # the /api prefix. Capsule reads no roles and syncs no directory.
  - client_id: capsule
    name: Capsule
    backchannel_logout_uri: https://capsule.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_CAPSULE_SECRET
    redirect_uris:
      - https://capsule.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  # Echo, the suite's video calls at echo.facile.studio. A fresh registration,
  # so the id is its own name, like Sonde and Prisme. Guests join by link with
  # no account; sign-in only identifies room owners and their history.
  #
  # porte is mounted inside router.Route("/api", ...), so the redirect keeps
  # the /api prefix. Echo's deletion receiver has its own URL, apart from the
  # directory nudge (the two must differ).
  - client_id: echo
    name: Echo
    directory_sync_uri: https://echo.facile.studio/api/registre/sync
    deletion_uri: https://echo.facile.studio/api/registre/deletions
    backchannel_logout_uri: https://echo.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_ECHO_SECRET
    redirect_uris:
      - https://echo.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  # Place, the suite's unified forum at place.facile.studio.
  #
  # Fresh registration, so the id is its own name, like Sonde, Prisme and
  # Capsule. porte mounts under /api, so the redirect keeps the /api prefix.
  # Place reads one role, admin, which opens its admin page (announcements and
  # the media review queue). It syncs no directory, so no directory_sync_uri is
  # declared; OIDC_CLAIMS_SCOPE=roles is set on the app side.
  #
  # The connections scope carries the linked Discord id, so Place can attach
  # Discord messages to the account. login_providers is what puts "Continue
  # with Discord" on the login Place sends people to; no other client has it.
  - client_id: place
    name: Place
    backchannel_logout_uri: https://place.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_PLACE_SECRET
    redirect_uris:
      - https://place.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access, connections, roles]
    visible_roles: [admin]
    login_providers: [discord, github]

  # Sonar, the suite's private web search at sonar.facile.studio. A fresh
  # registration, so the id is its own name. porte is mounted under /api, so
  # the redirect keeps the prefix. The directory nudge carries the
  # sonar.searches_daily and ai.access entitlements; the deletion receiver has
  # its own URL, apart from the nudge.
  - client_id: sonar
    name: Sonar
    directory_sync_uri: https://sonar.facile.studio/api/registre/sync
    deletion_uri: https://sonar.facile.studio/api/registre/deletions
    backchannel_logout_uri: https://sonar.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_SONAR_SECRET
    redirect_uris:
      - https://sonar.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]
    # Search and fetch are reads, so the MCP server has no write scope.
    mcp:
      resource: https://sonar.facile.studio/mcp
      scopes: [sonar.read]

  # Bulle, the suite's coding agent and harness at bulle.facile.studio.
  #
  # token_exchange (RFC 8693) is how Bulle reaches a signed-in user's own mail,
  # calendar, tasks, timer, files and memory. Bulle trades that user's Bulle
  # token at the token endpoint for a five-minute token addressed to exactly one
  # of the apps below, carrying `sub` = the user, `act.sub` = bulle, the scopes
  # named here and `email` when the user's address is verified. The app verifies
  # it offline through porte's OIDC_MACHINE_AUDIENCE path and maps `sub` or
  # `email` to its own account; it never sees Bulle's login token. Declaring any
  # entry is what grants the exchange grant, so grant_types stays unlisted.
  #
  # `audience` is written into the issued token's `aud` claim byte for byte and
  # nothing is resolved: registre has no name lookup, so the string here must
  # equal the receiving app's OIDC_MACHINE_AUDIENCE exactly. The suite standard
  # is the app's client_id, which is what these entries and suite-ci above use.
  #
  # Scopes are `<app name, lower case>.read` or `.write`, and are checked
  # against the audience's `name` at boot. Bulle asks for `.read` on every
  # call and for `.write` only on a change the user approved in Bulle, so a
  # read never carries write power.
  - client_id: bulle
    name: Bulle
    directory_sync_uri: https://bulle.facile.studio/api/registre/sync
    deletion_uri: https://bulle.facile.studio/api/registre/deletions
    backchannel_logout_uri: https://bulle.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_BULLE_SECRET
    redirect_uris:
      - https://bulle.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]
    token_exchange:
      - audience: tniN7PWx8mSOCwVAAvYpBexYnMFWAM5flt19rNl0
        scopes: [courrier.read, courrier.write]
      - audience: vvVAmcun8BFuAxMdNrp6lhqs2anzvz3vnzkeZh3U
        scopes: [agenda.read, agenda.write]
      - audience: aHKmbSdWbJKqUMdTjIqFz2h4YtKYkvMiTB39zr4D
        scopes: [opus.read, opus.write]
      - audience: 5TVdL3zCbhhh7XCs3MvaIr5nqoV2ZIMLeEdjnVYu
        scopes: [sablier.read, sablier.write]
      - audience: 9U40zs8fnTkpKpR6MMobIOXk0OkvotC7vd1NECGH
        scopes: [nuage.read, nuage.write]
      - audience: mycelium
        scopes: [mycelium.read, mycelium.write]
      - audience: 1IdqK3bA2LWI-zuWVLqFpnIlCTVu117F
        scopes: [glouton.read, glouton.write]

