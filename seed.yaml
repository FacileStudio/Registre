    scopes: [openid, profile, email, offline_access, roles]
    visible_roles: [admin]
    token_exchange:
      - audience: bulle
        scopes: [bulle.read, bulle.write]

  - client_id: b0f6NMJbVkZ89jgWOjfWYICAwCDb4jTCTMMDAonW
