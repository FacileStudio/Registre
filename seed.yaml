# registre's production seed, deployed at sso.facile.studio. It carries no
# credentials and must not: each account names the environment variable holding
# its secret, and a missing one fails the boot rather than leaving an account
# nobody can authenticate as. The secret values live in Dokploy's compose
# environment and in ~/registre-secrets/ on lucy until the backup task lands.
#
# Applying is an upsert keyed on client_id, and it never deletes.

service_accounts:
  # The suite CI account. Drives the live round-trip test
  # (TestALiveRegistreIssuesAVerifiableToken) and, later, whatever automation
  # needs to prove it is a machine and not a human.
  - client_id: suite-ci
    name: Suite CI
    secret_env: REGISTRE_SEED_SUITE_CI_SECRET
    scopes:
      - courrier.read
    audiences:
      - tniN7PWx8mSOCwVAAvYpBexYnMFWAM5flt19rNl0
    access_token_ttl: 1h

applications:
  # Mycelium, the shared agent brain at mycelium.facile.studio, and registre's
  # first consumer. It was pointed at Authentik under the name the tool carried
  # before the rename; both that issuer and the redirect it named answer 404
  # since the rename, so its login was already broken when it was cut over.
  #
  # The redirect is exact-match, byte for byte, and mycelium mounts its API
  # under /api — dropping that prefix is the one typo that turns every login
  # into an invalid_redirect_uri with nothing in the logs to say why.
  #
  # Scopes are left at the default (openid, profile, email), which is what
  # mycelium's own client asks for. It reads no roles, so visible_roles stays
  # empty, and it serves no back-channel logout endpoint, so that stays unset:
  # declaring one would POST logout tokens into a 404.
  - client_id: mycelium
    name: Mycelium
    secret_env: REGISTRE_SEED_MYCELIUM_SECRET
    redirect_uris:
      - https://mycelium.facile.studio/api/auth/oidc/callback

  # The seven suite apps, cut over from Authentik on 2026-08-25.
  #
  # Each keeps the client_id Authentik issued it, so no app changes its
  # OIDC_CLIENT_ID or OIDC_CLIENT_SECRET — only OIDC_ISSUER moved. Reusing the
  # id is what makes this a one-variable cutover instead of fourteen.
  #
  # Every redirect ends in /api/auth/oidc/callback because every app mounts
  # porte under /api. That was verified per app against the live deployment
  # rather than read off .env.example, three of which carry the older bare
  # path — and a bare path does not 404, it lands on the SvelteKit catch-all
  # and returns 200 with HTML, so the login simply never completes.
  #
  # offline_access is listed explicitly: porte always requests it, and without
  # the grant there is no refresh token, so claim refresh degrades in silence.
  - client_id: 5TVdL3zCbhhh7XCs3MvaIr5nqoV2ZIMLeEdjnVYu
    name: Sablier
    backchannel_logout_uri: https://sablier.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_SABLIER_SECRET
    redirect_uris:
      - https://sablier.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access, roles]
    visible_roles: [admin]

  - client_id: b0f6NMJbVkZ89jgWOjfWYICAwCDb4jTCTMMDAonW
    name: Casier
    backchannel_logout_uri: https://casier.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_CASIER_SECRET
    redirect_uris:
      - https://casier.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  - client_id: JnT6bwkiBXL9pqZKRdUHgYpK0hG7apupsUtCpl8A
    name: Antenne
    backchannel_logout_uri: https://antenne.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_ANTENNE_SECRET
    redirect_uris:
      - https://antenne.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  # agenda's deployed OIDC_REDIRECT_URL was missing the /api prefix, which is
  # why its callback returned HTML. The env is corrected to match this entry.
  - client_id: vvVAmcun8BFuAxMdNrp6lhqs2anzvz3vnzkeZh3U
    name: Agenda
    backchannel_logout_uri: https://agenda.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_AGENDA_SECRET
    redirect_uris:
      - https://agenda.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  - client_id: tniN7PWx8mSOCwVAAvYpBexYnMFWAM5flt19rNl0
    name: Courrier
    backchannel_logout_uri: https://courrier.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_COURRIER_SECRET
    redirect_uris:
      - https://courrier.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  - client_id: 6FkN7WYS9xtKNMJMdKRtBWPLfLoS35EWELHIjgkf
    name: Plume
    backchannel_logout_uri: https://plume.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_PLUME_SECRET
    redirect_uris:
      - https://plume.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  - client_id: RLy72hckdFTa9eIFwCmV5MtDOWny1fLeTLpM5LUD
    name: Vision
    backchannel_logout_uri: https://vision.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_VISION_SECRET
    redirect_uris:
      - https://vision.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  # facile-cli, the suite's own command line, and the first client that logs a
  # human in without a browser on the same machine.
  #
  # It is public: no secret_env, and none possible. The binary is installed on
  # laptops and on servers, so anything compiled into it is readable by whoever
  # has a copy, and a secret every holder can read is not one. What defends it
  # instead is the device grant itself — every login is a code a named human
  # reads and approves at sso.facile.studio/device — plus PKCE if it ever gains
  # a browser flow.
  #
  # No redirect_uris, deliberately. The device grant has no redirect; that is
  # the whole reason it exists here. `facile login` on a server used to open a
  # loopback listener and send the browser to 127.0.0.1, which on a different
  # computer is that computer, so the login silently never completed.
  #
  # offline_access is listed because a CLI that has to be re-approved by hand
  # every hour is a CLI nobody uses.
  - client_id: facile-cli
    name: Facile CLI
    public: true
    grant_types: [device_code, refresh_token]
    scopes: [openid, profile, email, offline_access]

  # Journal, the suite's centralized logging, and Nuage, its file storage. Both
  # were already pointed at registre and both already hold a secret that matches
  # what the seed names — they were simply never declared here, so /authorize
  # answered `unable to retrieve client by id` for each of them.
  #
  # Nuage is the urgent half of that pair: it runs SSO_ONLY=true, so an
  # unregistered client is not a degraded login, it is no login at all. Journal
  # runs SSO_ONLY=false and kept its password path throughout.
  #
  # journal's client id is a UUID rather than the 40-character shape Authentik
  # issued the others. It is kept as it is: the id has to match what the app
  # already sends, and what it sends is this.
  - client_id: 8bf0bcb5-e1c4-4e1e-830d-a39eb4b7c9a3
    name: Journal
    backchannel_logout_uri: https://journal.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_JOURNAL_SECRET
    redirect_uris:
      - https://journal.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  - client_id: 9U40zs8fnTkpKpR6MMobIOXk0OkvotC7vd1NECGH
    name: Nuage
    backchannel_logout_uri: https://nuage.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_NUAGE_SECRET
    redirect_uris:
      - https://nuage.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  - client_id: outline
    name: Docs
    secret_env: REGISTRE_SEED_DOCS_SECRET
    redirect_uris:
      - https://docs.facile.studio/auth/oidc.callback
    scopes: [openid, profile, email, offline_access]

  - client_id: aHKmbSdWbJKqUMdTjIqFz2h4YtKYkvMiTB39zr4D
    name: Opus
    secret_env: REGISTRE_SEED_OPUS_SECRET
    redirect_uris:
      - https://opus.facile.studio/api/auth/oidc/callback
      - https://opus.facile.studio/api/auth/oauth2/callback/custom
      - https://opus.facile.studio/api/auth/callback/custom
      - https://opus.facile.studio/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  - client_id: u2byAQpWBGWFMWJDpmgZSuakPwtsT4nhw41KhRgK
    name: Perception
    secret_env: REGISTRE_SEED_PERCEPTION_SECRET
    redirect_uris:
      - https://perception.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  - client_id: OpvjVWFZZ32QOrC91ebmpF8I22sumOPEdzcYLh07
    name: Coffre
    secret_env: REGISTRE_SEED_COFFRE_SECRET
    redirect_uris:
      - https://coffre.facile.studio/identity/connect/oidc-callback
      - https://coffre.facile.studio/auth/oidc/callback
      - https://coffre.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  - client_id: ptbYJqkekeusBo_t0fDC9KhVmfUtM9K0
    name: Atelier
    backchannel_logout_uri: https://atelier.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_ATELIER_SECRET
    redirect_uris:
      - https://atelier.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  - client_id: 1IdqK3bA2LWI-zuWVLqFpnIlCTVu117F
    name: Glouton
    secret_env: REGISTRE_SEED_GLOUTON_SECRET
    redirect_uris:
      - https://glouton.facile.studio/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  # Sonde, the suite's self-hosted uptime monitor at sonde.facile.studio.
  #
  # This one is a fresh registration, not an Authentik carry-over: Sonde never
  # federated to the old IdP, so there is no legacy 40-character client id to
  # preserve and the id is simply its own name.
  #
  # The redirect is exact-match, byte for byte, and Sonde mounts porte's kit
  # inside router.Route("/api", ...), so the /api prefix is part of the path
  # rather than decoration. No loopback redirect: no application in this file
  # declares one, and Sonde has no browser flow that starts on localhost.
  #
  # The back-channel URI is served: porte's Kit.Mount registers
  # POST /auth/backchannel-logout for every kit with a provider configured, so
  # the route appears the moment OIDC_ISSUER is set. It answers 404 until then,
  # which is what Sonde does today, before its cutover.
  #
  # Scopes match the other recently cut-over apps. offline_access is listed
  # explicitly because porte always requests it, and without the grant refresh
  # degrades in silence. roles and visible_roles are left out: Sonde reads no
  # roles and sets no OIDC_CLAIMS_SCOPE, so granting the scope would carry a
  # claim nobody looks at.
  - client_id: sonde
    name: Sonde
    backchannel_logout_uri: https://sonde.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_SONDE_SECRET
    redirect_uris:
      - https://sonde.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]

  # Bulle, the suite's coding agent and harness at bulle.facile.studio.
  #
  # token_exchange (RFC 8693) is how Bulle reads a signed-in user's own mail,
  # calendar, tasks and timer. Bulle trades that user's Bulle token at the token
  # endpoint for a five-minute token addressed to exactly one of the apps below,
  # carrying `sub` = the user, `act.sub` = bulle and the scopes named here. The
  # app verifies it offline through porte's OIDC_MACHINE_AUDIENCE path and maps
  # `sub` to its own account; it never sees Bulle's login token. Declaring any
  # entry is what grants the exchange grant, so grant_types stays unlisted.
  #
  # `audience` is written into the issued token's `aud` claim byte for byte and
  # nothing is resolved: registre has no name lookup, so the string here must
  # equal the receiving app's OIDC_MACHINE_AUDIENCE exactly. The suite standard
  # is the app's client_id, which is what these entries and suite-ci above use.
  #
  # Scopes are `<app name, lower case>.read` or `.write`, and are checked
  # against the audience's `name` at boot. Only `.read` is granted: the Bulle
  # tools are read-only, and a write scope is one line here when they are not.
  - client_id: bulle
    name: Bulle
    backchannel_logout_uri: https://bulle.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_BULLE_SECRET
    redirect_uris:
      - https://bulle.facile.studio/api/auth/oidc/callback
    scopes: [openid, profile, email, offline_access]
    token_exchange:
      - audience: tniN7PWx8mSOCwVAAvYpBexYnMFWAM5flt19rNl0
        scopes: [courrier.read]
      - audience: vvVAmcun8BFuAxMdNrp6lhqs2anzvz3vnzkeZh3U
        scopes: [agenda.read]
      - audience: aHKmbSdWbJKqUMdTjIqFz2h4YtKYkvMiTB39zr4D
        scopes: [opus.read]
      - audience: 5TVdL3zCbhhh7XCs3MvaIr5nqoV2ZIMLeEdjnVYu
        scopes: [sablier.read]

