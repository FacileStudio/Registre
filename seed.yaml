# registre's production seed, deployed at sso.facile.studio. It carries no
# credentials and must not: each account names the environment variable holding
# its secret, and a missing one fails the boot rather than leaving an account
# nobody can authenticate as. The secret values live in Dokploy's compose
# environment and in ~/registre-secrets/ on lucy until the backup task lands.
#
# Applying is an upsert keyed on client_id, and it never deletes.

service_accounts:
  # The suite CI account. Drives the live round-trip test
  # (TestALiveRegistreIssuesAVerifiableToken) and, later, whatever automation
  # needs to prove it is a machine and not a human.
  - client_id: suite-ci
    name: Suite CI
    secret_env: REGISTRE_SEED_SUITE_CI_SECRET
    scopes:
      - courrier.read
    audiences:
      - tniN7PWx8mSOCwVAAvYpBexYnMFWAM5flt19rNl0
    access_token_ttl: 1h

applications:
  # Mycelium, the shared agent brain at mycelium.facile.studio, and registre's
  # first consumer. It was pointed at Authentik under the name the tool carried
  # before the rename; both that issuer and the redirect it named answer 404
  # since the rename, so its login was already broken when it was cut over.
  #
  # The redirect is exact-match, byte for byte, and mycelium mounts its API
  # under /api — dropping that prefix is the one typo that turns every login
  # into an invalid_redirect_uri with nothing in the logs to say why.
  #
  # Scopes are left at the default (openid, profile, email), which is what
  # mycelium's own client asks for. It reads no roles, so visible_roles stays
  # empty, and it serves no back-channel logout endpoint, so that stays unset:
  # declaring one would POST logout tokens into a 404.
  - client_id: mycelium
    name: Mycelium
    directory_sync_uri: https://mycelium.facile.studio/api/registre/sync
    deletion_uri: https://mycelium.facile.studio/api/registre/deletions
    secret_env: REGISTRE_SEED_MYCELIUM_SECRET
    redirect_uris:
      - https://mycelium.facile.studio/api/auth/oidc/callback
    token_exchange:
      - audience: bulle
        scopes: [bulle.read, bulle.write]

  # The seven suite apps, cut over from Authentik on 2026-08-25.
  #
  # Each keeps the client_id Authentik issued it, so no app changes its
  # OIDC_CLIENT_ID or OIDC_CLIENT_SECRET — only OIDC_ISSUER moved. Reusing the
  # id is what makes this a one-variable cutover instead of fourteen.
  #
  # Every redirect ends in /api/auth/oidc/callback because every app mounts
  # porte under /api. That was verified per app against the live deployment
  # rather than read off .env.example, three of which carry the older bare
  # path — and a bare path does not 404, it lands on the SvelteKit catch-all
  # and returns 200 with HTML, so the login simply never completes.
  #
  # offline_access is listed explicitly: porte always requests it, and without
  # the grant there is no refresh token, so claim refresh degrades in silence.
  - client_id: 5TVdL3zCbhhh7XCs3MvaIr5nqoV2ZIMLeEdjnVYu
    name: Sablier
    directory_sync_uri: https://sablier.facile.studio/api/registre/sync
    deletion_uri: https://sablier.facile.studio/api/registre/deletions
    backchannel_logout_uri: https://sablier.facile.studio/api/auth/backchannel-logout
    secret_env: REGISTRE_SEED_SABLIER_SECRET
    redirect_uris:
