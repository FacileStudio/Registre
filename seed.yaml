    scopes: [openid, profile, email, offline_access]
    mcp:
      resource: https://nuage.facile.studio/mcp
      scopes: [nuage.read, nuage.write]
    token_exchange:
      - audience: bulle
        scopes: [bulle.read, bulle.write]

