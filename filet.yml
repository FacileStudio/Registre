# The Facile suite's coding standard, enforced by filet.
# https://github.com/FacileStudio/filet
#
#   filet check .     the rules
#   filet gate .      the rules plus the formatter, tests and builds (pre-push)
#   filet roast .     the rules, with commentary
#
# `preset: facile` is the suite's shared configuration: the limits are the
# published defaults of the tools they come from, gen.line.long is off because
# the formatters own line breaking, and the architecture block requires a
# router.go in every module. Registre carries no exception to it, deliberately:
# a package under modules/ owns HTTP and says so in router.go; a domain service
# that owns no routes lives under internal/ (SPEC §5).

kind: app
preset: facile
